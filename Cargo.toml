[package]
name = "shotgun"
version = "0.1.0"
edition = "2021"
authors = ["phonie-bytes"]
description = "Lightweight, configurable screen & region capture utility with global hotkeys and sequential naming."

[dependencies]
eframe = "0.29"
egui = "0.29"
xcap = "0.2"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "webp", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
chrono = "0.4"
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Threading"
] }
directories = "5.0"
crossbeam-channel = "0.5"
arboard = "3.4"


