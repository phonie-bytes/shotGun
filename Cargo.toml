[package]
name = "shotgun"
version = "0.4.0"
edition = "2021"
authors = ["Noerotech"]
description = "Fast, lightweight screen & region capture utility with global hotkeys, sequential naming, tray icon, and auto-start."

[dependencies]
eframe = "0.29"
egui = "0.29"
xcap = "0.2"
image = { version = "0.25", features = ["png", "jpeg", "bmp", "webp", "ico"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"
chrono = "0.4"
windows-sys = { version = "0.59", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_DataExchange",
    "Win32_System_Memory"
] }
directories = "5.0"
crossbeam-channel = "0.5"
arboard = "3.4"
winreg = "0.52"
tray-icon = "0.19"
hound = "3.5"
windows = { version = "0.58", features = [
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
] }
printpdf = { version = "0.12", features = ["images", "png", "jpeg"] }
raw-window-handle = "0.6"

[dev-dependencies]
serial_test = "3"

